services:
  book-rag:
    build: .
    image: book-rag:latest
    container_name: book-rag
    ports:
      - "8000:8000"
    volumes:
      # 数据持久化：重启容器不丢索引和图片
      - ./data:/app/data
      # HuggingFace 模型缓存持久化：避免每次重启容器都重新下载 Chinese-CLIP（约 400MB）
      # 容器内 root 用户的 HF 缓存默认在 /root/.cache/huggingface
      - hf_cache:/root/.cache/huggingface
      # 配置文件挂载（API Key 等敏感信息不入镜像）
      - ./.env:/app/.env:ro
    environment:
      # Chinese-CLIP 模型从国内镜像下载，避免连不上 huggingface.co
      - HF_ENDPOINT=https://hf-mirror.com
      - HF_HUB_DISABLE_XET=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - default
      - ragflow_net

# 命名卷：由 Docker 管理，重启容器不丢失，但不进入镜像层
volumes:
  hf_cache:

networks:
  default:
    driver: bridge
  # 加入 RAGFlow 的 Docker 网络，让 RAGFlow 容器能用容器名 book-rag 直接访问本服务
  # 不需要放行 8000 公网端口，走 Docker 内部网络更安全更快
  ragflow_net:
    external: true
    name: docker_ragflow